<!doctype html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html" style="width:390px;height:844px;border:0"></iframe>
<pre id="out">…</pre>
<script>
const errs=[];
document.getElementById('f').addEventListener('load', () => {
  const d = document.getElementById('f').contentDocument, w = document.getElementById('f').contentWindow;
  w.addEventListener('error', e => errs.push(e.message));
  const L=[];
  try {
    d.getElementById('f-name').value = '山田太郎';
    d.getElementById('f-birth').value = '1975-06-15T09:30';
    d.getElementById('f-consult').value = '2026-08-24T10:00';
    d.getElementById('btn-compute').click();
  } catch(e) { L.push('計算でエラー: '+e.message); }

  const ids = ['o-kyoushin','o-kichi-cal','o-houi-tori','o-month-flow','o-year-flow','o-eto-rel','o-rekichu','o-koyomi','o-gogyou','o-senjitsu','o-kasane','o-daiun','o-gemmei','o-doukai-mean','o-kimon','o-yakudoshi','o-shichu','o-kou','o-sekki','o-seimei','o-nacchin','o-kaiun','o-jishou','o-kenkou','o-unki-graph','o-kyou','o-yuki','o-kyohoui','o-sougou-shindan','o-meishiki','o-honmei','o-keisha'];
  const empty = ids.filter(i => { const el=d.getElementById(i); return !el || !el.textContent.trim(); });
  L.push('計算後に中身が空: ' + (empty.length ? empty.join(', ') : 'なし（全て描画された）'));
  L.push('本命='+d.getElementById('o-honmei').textContent.trim()+' / 命式='+d.getElementById('o-meishiki').textContent.trim().slice(0,40));
  L.push('JSエラー: '+(errs.length?errs.join(' | '):'なし'));
  document.getElementById('out').textContent = L.join('\n');
});
</script></body></html>
