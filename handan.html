<header class="app-header">
  <h1>干支九星気学</h1>

<main class="page">
  <h2 class="page-title">九星　判断書</h2>

  <div class="btn-row no-print">
    <a class="btn secondary" href="index.html" id="btn-back">← 鑑定書</a>
    <button class="btn" id="btn-recalc">再計算</button>
    <button class="btn secondary" id="btn-save">保存</button>
    <button class="btn secondary" id="btn-print">印刷 / PDF保存</button>
  </div>

  <div id="o-meta" style="font-size:13px;margin-bottom:8px;color:#555;font-family:var(--font-jp);"></div>

  <!-- 本人運気・年月運・内蔵法 -->
  <div style="margin-top:10px;">
    <div class="handan-section">
      <h3>本人運気　宮傾斜</h3>
      <div class="body">
        <div id="o-keisha" class="keisha-name"></div>
        <ul id="o-keisha-detail" class="keisha-detail"></ul>
        <textarea id="m-honnin" placeholder="メモ"></textarea>
      </div>
    </div>

    <div class="handan-section" style="margin-top:10px;">
      <h3>年月運</h3>
      <div class="body">
        <table style="width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-jp);">
          <tr>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">年同会</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-doukai-toshi"></td>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">年被同会</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-hidoukai-toshi"></td>
          </tr>
          <tr>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">月同会</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-doukai-tsuki"></td>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">月被同会</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-hidoukai-tsuki"></td>
          </tr>
        </table>
        <div id="o-kyu-zasuru" class="kyu-zasuru" style="margin-top:6px;"></div>
        <textarea id="m-nengetsu" style="margin-top:4px;" placeholder="メモ"></textarea>
      </div>
    </div>

    <div class="handan-section" style="margin-top:10px;">
      <h3>内蔵法</h3>
      <div class="body">
        <table style="width:100%;border-collapse:collapse;font-size:12px;font-family:var(--font-jp);">
          <tr>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">蔵気年月</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-kuraki-nm"></td>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">宿命年月</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-shukumei-nm"></td>
          </tr>
          <tr>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">蔵気月日</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-kuraki-md"></td>
            <td style="border:1px solid #888;padding:3px 6px;background:#f8f0d8;">宿命月日</td>
            <td style="border:1px solid #888;padding:3px 6px;" id="o-shukumei-md"></td>
          </tr>
        </table>
        <textarea id="m-naizou" style="margin-top:4px;"></textarea>
      </div>
    </div>
  </div>

  <!-- 早見表より自動抽出: 生月・生日 運勢 -->
  <div class="handan-section" style="margin-top:10px;">
    <h3>生月　性格と運勢</h3>
    <div class="body">
      <div id="o-seigetsu-label" class="hayami-label"></div>
      <div id="o-seigetsu-text" class="hayami-text"></div>
    </div>
  </div>

  <div class="handan-section" style="margin-top:10px;">
    <h3>生日　性格と運勢</h3>
    <div class="body">
      <div id="o-seinichi-label" class="hayami-label"></div>
      <div id="o-seinichi-text" class="hayami-text"></div>
    </div>
  </div>

  <!-- 星まつり (運気) -->
  <div class="handan-section" style="margin-top:10px;">
    <h3>星まつり　運気</h3>
    <div class="body">
      <div id="o-seimatsuri" class="seimatsuri-block"></div>
    </div>
  </div>

  <!-- 二十八宿 -->
  <div class="handan-section" style="margin-top:10px;">
    <h3>二十八宿（相談日）</h3>
    <div class="body">
      <div id="o-shuku" class="hayami-text"></div>
    </div>
  </div>
