<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相談者リスト">
<meta name="theme-color" content="#2b1a0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>相談者リスト</title>
</head>
<body>

<header class="app-header">
  <h1>干支九星気学</h1>
  <nav>
    <a href="index.html">鑑定書</a>
    <a href="clients.html" class="active">相談者リスト</a>
    <a href="history.html">履歴</a>
  </nav>
</header>

<main class="page">
  <h2 class="page-title">相談者リスト</h2>

  <div class="btn-row no-print">
    <a class="btn" href="index.html">+ 新規鑑定</a>
    <input type="search" id="search" placeholder="名前で検索" style="flex:1;min-width:160px;padding:6px 10px;font-size:14px;border:1px solid var(--c-border);border-radius:4px;">
  </div>

  <p style="font-size:12px;color:#888;">相談者ごとに鑑定をまとめて表示します。名前をタップで鑑定一覧を開閉。</p>

  <ul class="client-list" id="list"></ul>
</main>

<script src="js/storage.js?v=91"></script>
<script>
(function () {
  const list = document.getElementById('list');
  const searchInput = document.getElementById('search');

  function render(filter) {
    const f = (filter || '').trim().toLowerCase();
    const groups = Storage.getGroups();
    const filtered = f ? groups.filter(g => g.name.toLowerCase().includes(f)) : groups;
    list.innerHTML = '';
    if (filtered.length === 0) {
      list.innerHTML = '<li style="color:#888;padding:20px;text-align:center;">' +
        (f ? '該当する相談者がいません' : 'まだ相談者がいません') + '</li>';
      return;
    }
    filtered.forEach(group => {
      const li = document.createElement('li');
      li.className = 'client-item';

      const header = document.createElement('div');
      header.className = 'client-header';
      header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px;cursor:pointer;background:#f8f0d8;';

      const left = document.createElement('div');
      const title = document.createElement('div');
      title.textContent = group.name;
      title.style.cssText = 'font-size:15px;font-weight:bold;font-family:var(--font-jp);';
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.style.cssText = 'font-size:11px;color:#666;margin-top:2px;';
      const latest = group.records[0];
      meta.textContent = `鑑定 ${group.records.length}回　最新: ${latest?.consult || '-'}`;
      left.appendChild(title);
      left.appendChild(meta);

      const right = document.createElement('div');
      const arrow = document.createElement('span');
      arrow.textContent = '▼';
      arrow.style.cssText = 'font-size:11px;color:#888;transition:transform .15s;';
      right.appendChild(arrow);

      header.appendChild(left);
      header.appendChild(right);

      const body = document.createElement('ul');
      body.className = 'client-records';
      body.style.cssText = 'display:none;list-style:none;padding:0;margin:0;border-top:1px solid var(--c-border);';

      group.records.forEach(r => {
        const ri = document.createElement('li');
        ri.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px 12px 8px 22px;border-bottom:1px solid #eee;font-size:13px;';
        const rl = document.createElement('a');
        rl.href = 'index.html?id=' + r.id;
        rl.textContent = `相談: ${r.consult || '-'}　${r.topic ? '— ' + r.topic.slice(0, 30) : ''}`;
        rl.style.cssText = 'color:#2b1a0e;text-decoration:none;flex:1;';
        const del = document.createElement('button');
        del.className = 'btn danger';
        del.style.cssText = 'padding:3px 8px;font-size:11px;';
        del.textContent = '削除';
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm(`${group.name} の ${r.consult || ''} の鑑定を削除しますか?`)) {
            Storage.remove(r.id);
            render(searchInput.value);
          }
        };
        ri.appendChild(rl);
        ri.appendChild(del);
        body.appendChild(ri);
      });

      header.onclick = () => {
        const open = body.style.display !== 'none';
        body.style.display = open ? 'none' : 'block';
        arrow.style.transform = open ? '' : 'rotate(180deg)';
      };

      li.appendChild(header);
      li.appendChild(body);
      list.appendChild(li);
    });
  }

  searchInput.addEventListener('input', () => render(searchInput.value));
  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>
